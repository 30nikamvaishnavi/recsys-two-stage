name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements-ci.txt
      - run: pip install -e . --no-deps
      - name: Lint
        run: |
          ruff check src tests dags scripts app
          black --check src tests dags scripts app
      - name: Unit + integration tests (no TF/Spark)
        run: pytest -q
